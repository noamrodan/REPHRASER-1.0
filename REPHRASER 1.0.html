<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e9">
  <title>rephraser 1.0 — A different way to read it</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #263d35;
      --muted: #718078;
      --paper: #fffdf7;
      --line: #e8e8d9;
      --accent: #bd8050;
      --accent-strong: #98613e;
      --shadow: 0 22px 65px rgba(48, 47, 42, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 10%, rgba(255, 215, 136, .42), transparent 34rem),
        radial-gradient(ellipse at 95% 85%, rgba(157, 208, 173, .35), transparent 32rem),
        #fff8e9;
      transition: background .4s ease, color .4s ease;
    }

    body.gloomy {
      color-scheme: dark;
      --ink: #e7e8ef;
      --muted: #a0a5b7;
      --paper: #252a38;
      --line: #3a4051;
      --accent: #98a0b2;
      --accent-strong: #bac1d1;
      --shadow: 0 22px 65px rgba(0, 0, 0, .25);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(81, 91, 124, .26), transparent 36rem),
        radial-gradient(ellipse at 95% 90%, rgba(53, 70, 87, .28), transparent 32rem),
        #191d28;
    }

    button, textarea { font: inherit; }
    button { color: inherit; }

    .site-header {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.03em;
      text-decoration: none;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(145deg, #f8c667, #eb8a58);
      font-size: 18px;
      box-shadow: 0 5px 14px rgba(223, 129, 68, .25);
    }

    main {
      width: min(760px, calc(100% - 36px));
      margin: clamp(32px, 8vh, 84px) auto 70px;
    }

    .intro {
      position: relative;
      text-align: center;
    }

    .weather {
      width: 52px;
      height: 52px;
      position: absolute;
      top: 4px;
      right: 9%;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 50%;
      color: var(--accent-strong);
      background: color-mix(in srgb, var(--paper) 60%, transparent);
      font-size: 25px;
      transition: color .35s ease, transform .35s ease;
    }

    .weather::after {
      position: absolute;
      right: -14px;
      bottom: -7px;
      content: "✿";
      color: #a4a96b;
      font-size: 15px;
      transition: color .35s ease, content .35s ease;
    }

    .gloomy .weather {
      transform: translateY(3px);
    }

    .gloomy .weather::after {
      content: "·  ·";
      right: -12px;
      bottom: -11px;
      color: #9aa8c2;
      font-size: 20px;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(39px, 7vw, 63px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.05;
    }

    .switcher {
      display: inline-flex;
      gap: 5px;
      padding: 5px;
      margin: 27px 0 19px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: color-mix(in srgb, var(--paper) 82%, transparent);
      box-shadow: 0 5px 20px rgba(43, 53, 44, .05);
    }

    .mode-button {
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .mode-button:hover { transform: translateY(-1px); }
    .mode-button[aria-pressed="true"] { color: #604522; background: #ffe8b5; }
    .gloomy .mode-button[aria-pressed="true"] { color: #f1f1f7; background: #454d64; }

    .card {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 23px;
      background: var(--paper);
      box-shadow: var(--shadow);
      text-align: left;
      transition: background .35s ease, border-color .35s ease;
    }

    .card-top {
      min-height: 61px;
      padding: 17px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .card-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 800;
    }

    .mood-icon { font-size: 17px; }

    .limit-note {
      color: var(--muted);
      font-size: 11px;
    }

    .input-area { padding: 19px 22px 18px; }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 3px 0;
      resize: vertical;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
      line-height: 1.75;
    }

    textarea::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .word-count {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .word-count.over { color: #d35c50; font-weight: 700; }

    .rewrite-button {
      min-height: 45px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #e9a448, #e88053);
      box-shadow: 0 7px 18px rgba(219, 133, 69, .25);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: transform .2s ease, opacity .2s ease;
    }

    .gloomy .rewrite-button {
      background: linear-gradient(135deg, #687899, #596680);
      box-shadow: 0 7px 18px rgba(31, 39, 57, .4);
    }

    .rewrite-button:hover:not(:disabled) { transform: translateY(-2px); }
    .rewrite-button:disabled { cursor: not-allowed; opacity: .45; box-shadow: none; }

    .examples {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .example-button {
      padding: 0;
      border: 0;
      border-bottom: 1px dotted currentColor;
      color: var(--accent-strong);
      background: transparent;
      cursor: pointer;
      font-size: inherit;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 22px 24px 19px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 20px;
      background: color-mix(in srgb, var(--accent) 8%, var(--paper));
      animation: rise .35s ease both;
    }

    .result.visible { display: block; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .copy-button {
      padding: 5px 0 5px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .copy-button:hover { color: var(--ink); }

    .result-text {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 540px) {
      .site-header { width: calc(100% - 32px); padding: 20px 0; }
      main { margin-top: 32px; }
      .weather { width: 40px; height: 40px; top: -17px; right: 3%; font-size: 20px; }
      .mode-button { padding: 0 12px; font-size: 12px; }
      .card-top { padding: 15px 17px; }
      .input-area { padding: 17px; }
      .result { padding: 19px 18px 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="rephraser 1.0 home">
      <span class="brand-mark" aria-hidden="true">R</span>
      <span>rephraser 1.0</span>
    </a>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Tell me what's<br>going on.</h1>
      <span class="weather" id="weather" aria-hidden="true">☀</span>

      <div class="switcher" role="group" aria-label="Choose a perspective">
        <button class="mode-button" id="hopeful-tab" type="button" aria-pressed="true">Optimistic rephrase</button>
        <button class="mode-button" id="gloomy-tab" type="button" aria-pressed="false">Pessimistic rephrase</button>
      </div>
    </section>

    <section class="card" aria-label="Rephrase your thought">
      <div class="card-top">
        <div class="card-label"><span class="mood-icon" id="mood-icon" aria-hidden="true">☀</span><span>Your version</span></div>
        <span class="limit-note">Up to 120 words</span>
      </div>
      <div class="input-area">
        <textarea id="thought" maxlength="1200" aria-label="Your thought" placeholder="Type a paragraph here…"></textarea>
        <div class="input-footer">
          <span class="word-count" id="word-count" aria-live="polite">0 / 120 words</span>
          <button class="rewrite-button" id="rewrite" type="button" disabled><span id="button-icon">↗</span><span id="button-label">Rephrase</span></button>
        </div>
      </div>
    </section>

    <p class="examples">Try <button class="example-button" id="example" type="button">“I didn't get the job I wanted.”</button></p>

    <section class="result" id="result" aria-live="polite" aria-labelledby="result-heading">
      <div class="result-heading"><span id="result-heading">Optimistic rephrase</span><button class="copy-button" id="copy" type="button">Copy text</button></div>
      <p class="result-text" id="result-text"></p>
    </section>

  </main>

  <script>
    const MAX_WORDS = 120;
    const input = document.querySelector("#thought");
    const count = document.querySelector("#word-count");
    const rewriteButton = document.querySelector("#rewrite");
    const result = document.querySelector("#result");
    const resultText = document.querySelector("#result-text");
    const hopefulTab = document.querySelector("#hopeful-tab");
    const gloomyTab = document.querySelector("#gloomy-tab");
    let mode = "hopeful";

    const replacements = {
      hopeful: [
        [/\bmissed the (train|bus|flight) by a minute\b/gi, "came within a mere minute of catching the $1"],
        [/\bhad to run to\b/gi, "got a brisk little sprint to"],
        [/\b(and )?was late anyway and (?:also )?(?:felt |was )?sweaty\b/gi, "$1arrived fashionably late anyway, impressively sweaty"],
        [/\bwas late anyway\b/gi, "arrived fashionably late anyway"],
        [/\bdidn't get the job\b/gi, "didn't happen to get the job"],
        [/\bdid not get the job\b/gi, "didn't happen to get the job"],
        [/\bfailed\b/gi, "made a valiant attempt and still failed"],
        [/\bfailure\b/gi, "minor setback"],
        [/\bterrible\b/gi, "not ideal, but hardly the end of the world"],
        [/\bawful\b/gi, "not ideal, but hardly the end of the world"],
        [/\bdisaster\b/gi, "minor setback"],
        [/\bproblems\b/gi, "tiny little problems"],
        [/\bproblem\b/gi, "tiny little problem"],
        [/\bmistakes\b/gi, "minor missteps"],
        [/\bmistake\b/gi, "minor misstep"],
        [/\bworried about\b/gi, "a little concerned about"],
        [/\bwrong\b/gi, "off"]
      ],
      gloomy: [
        [/\bmissed the (train|bus|flight) by a minute\b/gi, "missed the $1 by one maddening minute"],
        [/\bhad to run to\b/gi, "had to scramble all the way to"],
        [/\b(and )?was late anyway and (?:also )?(?:felt |was )?sweaty\b/gi, "$1still arrived late anyway, spectacularly sweaty"],
        [/\bwas late anyway\b/gi, "was still late anyway, naturally"],
        [/\bdidn't get the job\b/gi, "failed to get the job"],
        [/\bdid not get the job\b/gi, "failed to get the job"],
        [/\bsucceeded\b/gi, "barely scraped through"],
        [/\bsuccessful\b/gi, "barely successful"],
        [/\bfailed\b/gi, "spectacularly failed"],
        [/\bfailure\b/gi, "spectacular failure"],
        [/\bgreat\b/gi, "suspiciously good"],
        [/\bexcited\b/gi, "bracing for disappointment about"],
        [/\blucky\b/gi, "a statistical fluke"],
        [/\bperfect\b/gi, "one flaw away from a mess"],
        [/\bproblems\b/gi, "fresh hassles"],
        [/\bproblem\b/gi, "fresh hassle"],
        [/\bmistakes\b/gi, "avoidable blunders"],
        [/\bmistake\b/gi, "avoidable blunder"]
      ]
    };

    function wordCount(text) {
      const words = text.trim().match(/\S+/g);
      return words ? words.length : 0;
    }

    function transform(text, perspective) {
      let output = text.trim();
      for (const [pattern, replacement] of replacements[perspective]) {
        output = output.replace(pattern, replacement);
      }

      const isSetback = /\b(didn't|did not|can't|cannot|failed|failure|rejected|turned down|passed over|missed out|missed|late|lost|wrong|problem|problems|mistake|mistakes|cancelled|canceled|broke|broken|stuck|worried|awful|terrible|disaster|bad|low grade|poor grade|broke up|dumped|ghosted|cheated|argument|fight|forgot|sick|hurt|injured|damaged|lost|overdue|short|ran out)\b/i.test(text);
      const isWin = /\b(got the job|got hired|hired|promoted|promotion|accepted|passed|aced|good grade|great grade|succeeded|success|won|went well|said yes|engaged|married|reconciled|made up|caught the train|caught the bus|on time|finished|completed|fixed|recovered|saved|earned|paid off)\b/i.test(text);
      const isCarTrouble = /\b(car|vehicle|truck|van)\b/i.test(text) && /\b(broke|broken|stalled|flat tire|puncture|wouldn't start|would not start)\b/i.test(text);
      let hash = 0;
      const normalized = text.toLowerCase();
      for (let index = 0; index < normalized.length; index += 1) {
        hash = (hash * 31 + normalized.charCodeAt(index)) >>> 0;
      }
      function choose(lines) {
        return lines[hash % lines.length];
      }

      if (isCarTrouble) {
        const carLines = perspective === "hopeful"
          ? [
              " And apparently I get an unscheduled roadside break, a story for later, and a chance to discover whether my insurance or my emergency snacks are more useful.",
              " And now I get to learn a little about cars, accept a lift, and appreciate the next trip where the engine starts without a dramatic announcement.",
              " And look at that, a forced pause, a new mechanic contact, and a very convincing reason to let someone else handle the driving for a while."
            ]
          : [
              " And now the trip is delayed, the repair bill is warming up, and the campsite is starting to feel more theoretical by the minute.",
              " And apparently I get roadside waiting, an unexpected repair, and the exciting task of rearranging every plan that depended on the car.",
              " And there goes the schedule, plus the money and time required to make the car remember its one job."
            ];
        return output + choose(carLines);
      }
      const topic = /\b(job|position|role|interview|hiring|career|application|offer|workplace|promotion|boss|coworker|colleague)\b/i.test(text) ? "work"
        : /\b(pottery|ceramic|painting|drawing|artwork|craft|knitting|sewing|guitar|piano|music|photography|writing|novel|poem|gardening|hobby|hobbies)\b/i.test(text) ? "creative"
          : /\b(school|study|studying|exam|test|classroom|grade|teacher|university|college|homework|course|assignment|degree|lecture)\b/i.test(text) ? "school"
            : /\b(project|deadline|presentation|report|proposal|portfolio|experiment|research)\b/i.test(text) ? "projects"
              : /\b(relationship|partner|girlfriend|boyfriend|date|dating|crush|breakup|broke up|divorce|married|romance|romantic|spouse|ex\b|ghosted|cheated|friend|friendship)\b/i.test(text) ? "relationships"
            : /\b(dog|cat|puppy|kitten|pet|vet|veterinarian|horse|bird|fish)\b/i.test(text) ? "pets"
              : /\b(train|bus|flight|ferry|subway|tram|station|commute|traffic|taxi|uber|travel|trip|vacation|journey|car|driving|campsite|camping|road)\b/i.test(text) ? "travel"
                : /\b(money|cash|rent|bill|bills|paycheck|salary|budget|debt|price|cost|bought|purchase|shopping|refund|bank|credit card)\b/i.test(text) ? "money"
                  : /\b(lunch|breakfast|dinner|food|meal|restaurant|recipe|cooking|baking|coffee|cake|groceries|hungry)\b/i.test(text) ? "food"
                    : /\b(phone|computer|laptop|internet|website|app|software|printer|device|password|file|account|battery)\b/i.test(text) ? "technology"
                      : /\b(home|house|apartment|room|kitchen|plumbing|furniture|neighbor|garden|yard|moving)\b/i.test(text) ? "home"
                        : /\b(doctor|health|sick|illness|pain|hospital|appointment|injury|injured|medicine|medication|sleep|tired|workout|exercise)\b/i.test(text) ? "health"
                          : /\b(soccer|football|basketball|baseball|tennis|match|tournament|team|race|racing|sport|sports|practice|workout|game)\b/i.test(text) ? "sports"
                            : /\b(family|parent|mother|mom|father|dad|sister|brother|child|children|kid|kids|birthday|party|concert|movie|cinema|film|show|event|plan|plans)\b/i.test(text) ? "plans"
                              : "other";

      const variations = {
        work: {
          setback: {
            hopeful: [
              " And apparently I have been spared the commute and the meetings-that-could-have-been-emails lifestyle; I get my evenings back and another shot at a role that fits.",
              " And now my calendar has room for hobbies again, while my career gets to take a less obvious route. Inconvenient, but at least I don't have to pretend that job was my dream.",
              " And look at that, I get fresh interview stories, a clearer idea of what I want, and no new office coffee machine to learn."
            ],
            gloomy: [
              " And now I get another application portal, another interview outfit, and the thrilling task of explaining this plot twist to my résumé.",
              " And apparently my career has added a waiting room, a stack of follow-ups, and several weeks of refreshing my inbox like it owes me money.",
              " And now the opportunity is gone, but the interview replay is working overtime. At least the career detour comes with bonus admin."
            ]
          },
          win: {
            hopeful: [
              " And now I get the paycheck, the experience, and a fresh line on my résumé that doesn't require creative writing.",
              " And look at that, a real career opening, more room to grow, and proof that all those applications weren't just decorative.",
              " And I get a new title, new options, and the deeply satisfying right to be smug about backing myself."
            ],
            gloomy: [
              " And now come the extra expectations, the new responsibilities, and the discovery that apparently success is just more work wearing a nicer title.",
              " And I get to prove I deserved it every day, learn everyone's systems, and pretend the expanded calendar is a reward.",
              " And now I have a career to maintain, a reputation to protect, and absolutely no pressure whatsoever. Obviously."
            ]
          },
          other: {
            hopeful: [" And at least I get a paycheck, useful experience, and a clearer idea of what I want next.", " And look at that, I get a routine, new skills, and the option to make my next career move with actual information.", " And I get to collect experience while quietly keeping an eye out for the next interesting opportunity."],
            gloomy: [" And now I get deadlines, meetings, and a calendar that has apparently started making decisions for me.", " And naturally there are office politics, inboxes, and a fresh chance to wonder whether 'quick task' has ever meant quick.", " And I get to learn another system, remember everyone's name, and discover how many things fit under 'one small favor.'"]
          }
        },
        school: {
          setback: {
            hopeful: [" And apparently I get a very specific map of what to study next, plus another shot at a grade that doesn't get to decide my whole future.", " And now I know which chapter deserves my attention, and I still have time to change the ending before finals. Annoying feedback; useful timing.", " And look at that, extra practice, a clearer study plan, and one less illusion that a single test can measure an entire brain."],
            gloomy: [" And now this grade gets to loom over the next assignment, the next exam, and every ambitious plan I made before checking the syllabus.", " And apparently I get extra studying, less free time, and the uncertainty of whether I understood anything at all. One test, carrying the atmosphere of a disciplinary hearing.", " And now my study schedule has collapsed into emergency revision, and the textbook has the nerve to still be the same length."]
          },
          win: {
            hopeful: [" And now I get the grade, the options it opens, and the deeply satisfying right to be smug about all those study hours.", " And apparently the work paid off: more doors open, future plans look less imaginary, and I can enjoy a result I actually earned.", " And I get to carry this win into the next class or application—and enjoy one evening without negotiating with a textbook."],
            gloomy: [" And now everyone expects me to keep getting results like this, so naturally the next exam has become a sequel with a bigger budget.", " And the reward for doing well is harder material, higher expectations, and no excuse to relax. Education: the gift that keeps assigning homework.", " And now I have a reputation to maintain and a future decision to overthink. One good grade has apparently raised the bar permanently."]
          },
          other: {
            hopeful: [" And at least I get the knowledge, the credit, and one more step toward whatever I decide to do next.", " And look at that, I get new skills and a qualification that might open a door I haven't even looked for yet.", " And apparently all that studying has made the next class, project, or opportunity slightly less mysterious."],
            gloomy: [" And now there's another reading list, another deadline, and a calendar that thinks sleep is optional.", " And naturally this course has a sequel, a prerequisite, and a group project waiting around the corner.", " And I get to learn one thing while discovering three new things I apparently should already know."]
          }
        },
        projects: {
          setback: {
            hopeful: [" And apparently I get another pass at the project, a clearer idea of what needs fixing, and the chance to make the final version look intentional.", " And now I know where the plan got ambitious, so I can trim the unnecessary bits and spend the effort on what actually matters.", " And at least I caught the weak spot before calling it finished. Revision: the glamorous part where the project gets better and my schedule gets worse."],
            gloomy: [" And now the deadline, the unfinished parts, and the follow-up messages get to share one very crowded corner of my brain.", " And apparently I get to redo the work, explain the delay, and watch the project grow a second task list.", " And there goes the neat plan, replaced by revisions, reminders, and the suspicious feeling that I underestimated every step."]
          },
          win: {

    function showResult() {
      if (rewriteButton.disabled) return;
      resultText.textContent = transform(input.value, mode);
      result.classList.add("visible");
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function updateCount() {
      const words = wordCount(input.value);
      count.textContent = `${words} / ${MAX_WORDS} words`;
      count.classList.toggle("over", words > MAX_WORDS);
      rewriteButton.disabled = words === 0 || words > MAX_WORDS;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isHopeful = mode === "hopeful";
      document.body.classList.toggle("gloomy", !isHopeful);
      hopefulTab.setAttribute("aria-pressed", String(isHopeful));
      gloomyTab.setAttribute("aria-pressed", String(!isHopeful));
      document.querySelector("#mood-icon").textContent = isHopeful ? "☀" : "☁";
      document.querySelector("#weather").textContent = isHopeful ? "☀" : "☁";
      document.querySelector("#button-icon").textContent = isHopeful ? "↗" : "↘";
      document.querySelector("#button-label").textContent = "Rephrase";
      document.querySelector("#result-heading").textContent = isHopeful ? "Optimistic rephrase" : "Pessimistic rephrase";
      document.querySelector("meta[name='theme-color']").content = isHopeful ? "#fff8e9" : "#191d28";
      result.classList.remove("visible");
    }

    input.addEventListener("input", updateCount);
    rewriteButton.addEventListener("click", showResult);
    hopefulTab.addEventListener("click", () => setMode("hopeful"));
    gloomyTab.addEventListener("click", () => setMode("gloomy"));
    document.querySelector("#example").addEventListener("click", () => {
      input.value = "I didn't get the job I wanted.";
      updateCount();
      showResult();
    });
    document.querySelector("#copy").addEventListener("click", async (event) => {
      try {
        await navigator.clipboard.writeText(resultText.textContent);
        event.currentTarget.textContent = "Copied!";
        window.setTimeout(() => { event.currentTarget.textContent = "Copy text"; }, 1600);
      } catch (error) {
        event.currentTarget.textContent = "Copy unavailable";
        window.setTimeout(() => { event.currentTarget.textContent = "Copy text"; }, 2000);
      }
    });
